<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: aliceblue;
            color: black;
        }
        .dark{
            background-color: black;
            color:aliceblue;
        }
        #p1{
            position: absolute;
            top:20px;
            right: 10px;
        }
    </style>
</head>
<body>
    <span id="p1" onclick="togglebar()">🌗</span>
    <script>
        function togglebar(){
            document.body.classList.toggle("dark");
        }
    </script>
</body>
</html>
